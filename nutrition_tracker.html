<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nutrition Tracker</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--text:#1c1c1e;--muted:#6b7280;--accent:#16a34a;--line:#e5e7eb;--danger:#dc2626;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101113;--card:#1c1d20;--text:#f2f2f3;--muted:#9ca3af;--accent:#22c55e;--line:#2c2e33;--danger:#f87171}}
:root[data-theme="dark"]{--bg:#101113;--card:#1c1d20;--text:#f2f2f3;--muted:#9ca3af;--accent:#22c55e;--line:#2c2e33;--danger:#f87171}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;border:1px solid var(--line)}
.big{font-size:40px;font-weight:700}
.big small{font-size:16px;color:var(--muted);font-weight:500}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.macros b{display:block;font-size:20px}.macros span{font-size:12px;color:var(--muted)}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,button{font:inherit;font-size:17px;width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text)}
button.primary{background:var(--accent);color:#fff;border:0;font-weight:600;margin-top:14px}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row small{color:var(--muted);display:block}
.del{width:auto;padding:6px 10px;font-size:14px;color:var(--danger);background:none;border:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{color:var(--muted);text-align:center;padding:14px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{border:0;background:none;border-radius:0;padding:14px 4px;font-size:14px;color:var(--muted)}
nav button.on{color:var(--accent);font-weight:700}
.preview{margin-top:12px;padding:10px;border-radius:10px;background:var(--bg);font-size:15px;min-height:42px}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 10px);transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 16px;border-radius:20px;display:none;z-index:9}
</style>
</head>
<body>
<div class="toast" id="toast"></div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
const KEY="nutrition-tracker-v1";
let data={foods:{},log:[]};
try{const s=localStorage.getItem(KEY);if(s)data=JSON.parse(s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){toast("Could not save (storage blocked)");}}
const F=["calories","fat","protein","carbs"];
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
let tab="today",day=todayStr(),draft={};const KJ=4.184;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const calc=(e)=>{const f=data.foods[e.food];if(!f)return null;const k=e.grams/100;const o={};F.forEach(x=>o[x]=f[x]*k);return o;};
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",1600);}
function setTab(t){tab=t;render();}

function render(){
  document.getElementById("nav").innerHTML=[["today","Today"],["log","Log food"],["foods","Foods"]]
    .map(([k,l])=>`<button class="${tab===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("");
  const a=document.getElementById("app");
  if(tab==="today")a.innerHTML=viewToday();
  else if(tab==="log"){a.innerHTML=viewLog();updatePreview();}
  else{a.innerHTML=viewFoods();renderScan();energyHint();}
}

function viewToday(){
  const entries=data.log.map((e,i)=>({e,i})).filter(x=>x.e.date===day);
  const t={calories:0,fat:0,protein:0,carbs:0};
  entries.forEach(({e})=>{const n=calc(e);if(n)F.forEach(k=>t[k]+=n[k]);});
  const rows=entries.length?entries.map(({e,i})=>{const n=calc(e);
    return `<div class="row"><div>${esc(e.food)} · ${e.grams} g<small>${n?`${n.calories.toFixed(0)} kcal · F ${n.fat.toFixed(1)} · P ${n.protein.toFixed(1)} · C ${n.carbs.toFixed(1)}`:"food deleted"}</small></div><button class="del" onclick="delEntry(${i})">Delete</button></div>`;}).join("")
    :`<div class="empty">Nothing logged for this day.</div>`;
  return `<h1>Daily totals</h1>
  <div class="card"><input type="date" value="${day}" onchange="day=this.value||todayStr();render()">
  <div class="big" style="margin-top:12px">${t.calories.toFixed(0)} <small>kcal</small></div>
  <div class="macros"><div><b>${t.fat.toFixed(1)} g</b><span>Fat</span></div><div><b>${t.protein.toFixed(1)} g</b><span>Protein</span></div><div><b>${t.carbs.toFixed(1)} g</b><span>Carbs</span></div></div></div>
  <div class="card">${rows}</div>`;
}

function viewLog(){
  const names=Object.keys(data.foods).sort();
  if(!names.length)return `<h1>Log food</h1><div class="card empty">Add a food first in the Foods tab.</div>`;
  return `<h1>Log food</h1><div class="card">
  <label>Food</label><select id="lf" onchange="updatePreview()">${names.map(n=>`<option>${esc(n)}</option>`).join("")}</select>
  <label>Weight (grams)</label><input id="lg" type="number" inputmode="decimal" min="0" placeholder="e.g. 150" oninput="updatePreview()">
  <div class="preview" id="pv"></div>
  <button class="primary" onclick="addLog()">Add to today</button></div>`;
}
function updatePreview(){
  const pv=document.getElementById("pv");if(!pv)return;
  const f=data.foods[document.getElementById("lf").value],g=parseFloat(document.getElementById("lg").value);
  if(!f||!(g>0)){pv.textContent="Enter weight to preview nutrition.";return;}
  const k=g/100;pv.innerHTML=`<b>${(f.calories*k).toFixed(0)} kcal</b> · Fat ${(f.fat*k).toFixed(1)} g · Protein ${(f.protein*k).toFixed(1)} g · Carbs ${(f.carbs*k).toFixed(1)} g`;
}
function addLog(){
  const food=document.getElementById("lf").value,g=parseFloat(document.getElementById("lg").value);
  if(!(g>0)){toast("Enter a weight");return;}
  data.log.push({date:todayStr(),food,grams:g});save();day=todayStr();toast("Logged!");tab="today";render();
}
function delEntry(i){data.log.splice(i,1);save();render();}

function viewFoods(){
  const names=Object.keys(data.foods).sort();
  const list=names.length?names.map(n=>{const f=data.foods[n];
    return `<div class="row"><div>${esc(n)}<small>per 100 g: ${f.calories} kcal · F ${f.fat} · P ${f.protein} · C ${f.carbs}</small></div><button class="del" onclick="delFood(${JSON.stringify(n).replace(/"/g,"&quot;")})">Delete</button></div>`;}).join("")
    :`<div class="empty">No foods yet.</div>`;
  const d=draft;const v=k=>d[k]==null?"":d[k];
  return `<h1>Foods</h1><div class="card" id="scanbox"></div>
  <div class="card"><b>Add new food</b> <span style="color:var(--muted);font-size:13px">(values per 100 g)</span>
  <label>Name</label><input id="fn" type="text" placeholder="e.g. Chicken breast" value="${esc(v("name"))}">
  <div class="grid2"><div style="grid-column:1/-1"><label>Energy</label>
  <div style="display:flex;gap:8px"><input id="fc" type="number" inputmode="decimal" min="0" value="${v("energy")}" oninput="energyHint()">
  <select id="fu" style="width:92px" onchange="energyHint()"><option value="kcal"${d.unit!=="kJ"?" selected":""}>kcal</option><option value="kJ"${d.unit==="kJ"?" selected":""}>kJ</option></select></div>
  <div id="eh" style="font-size:13px;color:var(--muted);margin-top:4px"></div></div>
  <div><label>Fat (g)</label><input id="ff" type="number" inputmode="decimal" min="0" value="${v("fat")}"></div>
  <div><label>Protein (g)</label><input id="fp" type="number" inputmode="decimal" min="0" value="${v("protein")}"></div>
  <div style="grid-column:1/-1"><label>Carbs (g)</label><input id="fb" type="number" inputmode="decimal" min="0" value="${v("carbs")}"></div></div>
  <button class="primary" onclick="addFood()">Save food</button></div>
  <div class="card">${list}</div>`;
}
function energyHint(){
  const h=document.getElementById("eh");if(!h)return;
  const x=parseFloat(document.getElementById("fc").value),u=document.getElementById("fu").value;
  h.textContent=(u==="kJ"&&x>=0)?"= "+(x/KJ).toFixed(1)+" kcal (will be saved as kcal)":"";
}
function addFood(){
  const name=document.getElementById("fn").value.trim();
  const u=document.getElementById("fu").value;
  const v=["fc","ff","fp","fb"].map(id=>parseFloat(document.getElementById(id).value));
  if(!name||v.some(x=>isNaN(x)||x<0)){toast("Fill every field");return;}
  const kcal=u==="kJ"?v[0]/KJ:v[0];
  data.foods[name]={calories:Math.round(kcal*10)/10,fat:v[1],protein:v[2],carbs:v[3]};
  draft={};save();toast("Saved");render();
}
// ---- Label scanning (uses Claude via the page's "sample" capability) ----
let sampleFn=null;
try{if(window.claude&&claude.use)claude.use("sample").then(f=>{sampleFn=f;renderScan();}).catch(()=>{});}catch(e){}
function renderScan(){
  const b=document.getElementById("scanbox");if(!b)return;
  b.innerHTML=sampleFn
   ?`<b>Scan a nutrition label</b><div style="font-size:13px;color:var(--muted);margin:4px 0 10px">Take a photo of the nutrition table. Fields below are filled in for you to check, then save.</div>
     <input id="sf" type="file" accept="image/*" capture="environment" hidden onchange="scanLabel(this)">
     <button class="primary" style="margin-top:0" onclick="document.getElementById('sf').click()">📷 Scan label</button><div id="scanmsg" style="margin-top:10px;font-size:14px"></div>`
   :`<b>Scan a nutrition label</b><div style="font-size:13px;color:var(--muted);margin-top:4px">Scanning is available when this page is opened inside Claude (claude.ai or the Claude app), not from a home-screen shortcut.</div>`;
}
function shrink(file){return new Promise((res,rej)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{const m=1600,k=Math.min(1,m/Math.max(img.width,img.height));
    const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);
    c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
    c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",0.85);};
  img.onerror=()=>rej(new Error("img"));img.src=url;});}
const SCAN_PROMPT=`This is a photo of a food nutrition label. Extract the values and reply with JSON only, no other text:
{"name": product name if visible else "", "basis": "per100g" or "perserving", "serving_g": serving size in grams/ml or null, "energy_kcal": number or null, "energy_kj": number or null, "fat": number, "protein": number, "carbs": number}
Rules: if the label has both a per 100 g/100 ml column and a per serving column, use the per 100 g/100 ml column (basis "per100g"). Use total fat, protein and total carbohydrate (not the "of which sugars" line). Use null for anything unreadable; never guess.`;
async function scanLabel(inp){
  const file=inp.files[0];inp.value="";if(!file||!sampleFn)return;
  const msg=document.getElementById("scanmsg");msg.textContent="Reading label…";
  try{
    const blob=await shrink(file);
    const r=await sampleFn.json(SCAN_PROMPT,{images:[blob]});
    let k=1,note="";
    if(r.basis==="perserving"){
      if(r.serving_g>0){k=100/r.serving_g;note=" Converted from per-serving ("+r.serving_g+" g) to per 100 g.";}
      else note=" Label is per serving and the size was unclear, so values may not be per 100 g.";
    }
    const n=x=>(x==null||isNaN(+x))?null:Math.round(+x*k*10)/10;
    const kcal=n(r.energy_kcal),kj=n(r.energy_kj);
    draft={name:r.name||"",fat:n(r.fat),protein:n(r.protein),carbs:n(r.carbs),
           energy:kcal!=null?kcal:kj,unit:kcal!=null?"kcal":"kJ"};
    render();
    const m2=document.getElementById("scanmsg");if(m2)m2.textContent="Done. Please check the values below, then tap Save food."+note;
  }catch(e){
    msg.textContent=(e&&e.code==="not_granted")?"Permission to use Claude was declined.":"Couldn't read that photo. Try a sharper, well-lit shot.";
  }
}
function delFood(n){if(confirm("Delete "+n+"?")){delete data.foods[n];save();render();}}
render();
</script>
</body>
</html>
